
name: Build Hermes Mobile IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install Tuist
        run: |
          brew install tuist
          tuist version

      - name: Generate Xcode project
        run: |
          tuist install
          tuist generate --no-open

      - name: Show available schemes
        run: |
          xcodebuild -list

      - name: Build iOS app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -scheme HermesMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/HermesMobile.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: HermesMobile.app was not found."
            find "$RUNNER_TEMP/DerivedData/Build/Products" \
              -maxdepth 3 -name '*.app' -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ipa/Payload" \
            "$RUNNER_TEMP/HermesMobile-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesMobile-unsigned-IPA
          path: ${{ runner.temp }}/HermesMobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HermesMobile-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
